<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR - Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 ">
    <div class="min-h-screen">
        <div class="bg-[#ffffff6e] backdrop-blur-sm rounded-lg  sticky top-10 z-10 p-10 border border-gray-300 md:mx-20 mx-5 text-center ">
            <p>Tap Generate new button to get new QR</p>
            

            <!-- // QR Code will be displayed here  -->
            <div id="qr_basement" class="flex flex-col items-center justify-center mt-4">

            </div>
            <button id="generateNewQr" class="bg-orange-500 text-white w-[220px] text-center py-2 rounded-lg">Generate new</button>
        </div>

        <section class=" mt-10">

        <div class="bg-[#ffffff6e] backdrop-blur-sm rounded-lg p-10 border border-gray-300 md:mx-20 mx-5 mt-10">
            <!-- <p class="mb-4">Verify Email</p> -->
            <form onsubmit="handleCheckEmail(event)" class="flex flex-col items-center gap-4">
                <input type="email" id="emailInput" placeholder="Enter your email" class="w-[220px] px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button id="verifyEmailBtn" class="bg-orange-500 text-white w-[220px] py-2 rounded-lg">Check Verification</button>
            </form>
            <p id="verificationResult" class="mt-4 text-center"></p>
        </div>


    </section>
</div>

<script src="./qr_generator.js"></script>
</body>
</html>
