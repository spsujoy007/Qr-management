<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="verify_page.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-xl border border-slate-700 p-6 sm:p-8">
    
    <h2 class="text-2xl font-bold text-center text-sky-400 mb-6">
      Secure Checkout
    </h2>

    <!-- // show when successful and wait for verify link  -->
    <div id="success_message" class="hidden text-green-400 text-center mb-6">

    </div>

    <form onsubmit="handleSubmitForm(event)" class="space-y-5" id="form">
      
      <!-- Reference Code -->
      <div>
        <label class="block text-sm text-slate-400 mb-1">Reference Code</label>
        <input
        id="reference_code" 
          type="text"
          disabled
          placeholder="6-Digit Code"
          pattern="[0-9]{6}"
          required
          class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-gray-300 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500"
        >
      </div>

      <!-- Full Name -->
      <div>
        <label class="block text-sm text-slate-400 mb-1">Full Name</label>
        <input 
          type="text"
          name="name"
          placeholder="Your full name"
          required
          class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500"
        >
      </div>

      <!-- Gmail -->
      <div>
        <label class="block text-sm text-slate-400 mb-1">Gmail</label>
        <input 
          type="email"
          name="email"
          placeholder="example@gmail.com"
          pattern=".+@gmail\.com"
          required
          class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500"
        >
      </div>

      <!-- Checkbox -->
      <div class="flex items-start gap-3">
        <input 
          type="checkbox"
          required
          class="mt-1 w-5 h-5 accent-sky-500"
        >
        <p class="text-sm text-slate-400">
          I confirm that all the details provided are correct.
        </p>
      </div>

      <!-- Submit -->
       <span class="hidden" id="error_msg"></span>
      <button
        id="checkoutBtn"
        type="submit"
        class="w-full py-3 rounded-lg bg-sky-500 hover:bg-sky-600 active:scale-95 transition text-black font-bold text-lg shadow-lg"
      >
        Confirm & Checkout
      </button>

    </form>

  </div>


  <script src="verify.js"></script>
</body>
</html>
